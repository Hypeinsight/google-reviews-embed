<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hype Insight Reviews</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #46B646;
      --color-dark: #02202E;
      --color-white: #FFFFFF;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-dark);
      color: var(--color-white);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
      box-shadow: 0 2px 8px rgba(70, 182, 70, 0.3);
    }

    .btn-primary:hover {
      background: #3da03d;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .section {
      background: rgba(255, 255, 255, 0.08);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .subscription-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .info-value {
      font-size: 16px;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-info {
      background: #dbeafe;
      color: #1e40af;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      transition: width 0.3s;
    }

    .progress-fill.warning {
      background: #f59e0b;
    }

    .progress-fill.danger {
      background: #ef4444;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .pricing-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s;
    }

    .pricing-card.current {
      border-color: var(--color-primary);
      background: rgba(70, 182, 70, 0.1);
    }

    .pricing-card:hover {
      transform: translateY(-4px);
      border-color: var(--color-primary);
    }

    .pricing-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .pricing-price {
      font-size: 32px;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 16px;
    }

    .pricing-price span {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
    }

    .pricing-features {
      list-style: none;
      margin-bottom: 24px;
    }

    .pricing-features li {
      padding: 8px 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .pricing-features li:before {
      content: "✓ ";
      color: var(--color-primary);
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 64px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="welcomeText">Dashboard</h1>
        <p style="color: rgba(255, 255, 255, 0.7); margin-top: 4px;" id="tenantName"></p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="loadingSection" class="loading">
      Loading your dashboard...
    </div>

    <div id="dashboardContent" style="display: none;">
      <!-- Stats Overview -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Feedback</div>
          <div class="stat-value" id="totalFeedback">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">This Month</div>
          <div class="stat-value" id="monthFeedback">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Locations</div>
          <div class="stat-value" id="totalLocations">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Rating</div>
          <div class="stat-value" id="avgRating">-</div>
        </div>
      </div>

      <!-- Subscription Info -->
      <div class="section">
        <h2>Subscription & Usage</h2>
        <div id="subscriptionSection"></div>
      </div>

      <!-- Upgrade Plans -->
      <div class="section" id="plansSection" style="display: none;">
        <h2>Available Plans</h2>
        <div id="pricingGrid" class="pricing-grid"></div>
      </div>
    </div>
  </div>

  <script>
    let userData = null;
    let subscriptionData = null;
    let usageData = null;

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me', {
          credentials: 'include'
        });

        if (!response.ok) {
          window.location.href = '/client/index.html';
          return false;
        }

        const data = await response.json();
        userData = data.user;
        
        document.getElementById('welcomeText').textContent = `Welcome, ${userData.name || userData.email}`;
        document.getElementById('tenantName').textContent = userData.tenantName;
        
        return true;
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '/client/index.html';
        return false;
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch('/api/client/dashboard', {
          credentials: 'include'
        });

        if (!response.ok) throw new Error('Failed to load dashboard');

        const data = await response.json();
        
        document.getElementById('totalFeedback').textContent = data.stats.totalFeedback;
        document.getElementById('monthFeedback').textContent = data.stats.monthFeedback;
        document.getElementById('totalLocations').textContent = data.stats.totalLocations;
        document.getElementById('avgRating').textContent = data.stats.avgRating || '-';
      } catch (error) {
        console.error('Failed to load dashboard:', error);
      }
    }

    async function loadSubscription() {
      try {
        const response = await fetch('/api/billing/subscription', {
          credentials: 'include'
        });

        const data = await response.json();
        subscriptionData = data.subscription;

        if (subscriptionData) {
          renderSubscription();
        } else {
          renderTrial(data.trial);
          showUpgradePlans();
        }
      } catch (error) {
        console.error('Failed to load subscription:', error);
      }
    }

    async function loadUsage() {
      try {
        const response = await fetch('/api/billing/usage', {
          credentials: 'include'
        });

        const data = await response.json();
        usageData = data.usage;
        renderUsage();
      } catch (error) {
        console.error('Failed to load usage:', error);
      }
    }

    function renderSubscription() {
      const section = document.getElementById('subscriptionSection');
      const endDate = new Date(subscriptionData.currentPeriodEnd);
      
      section.innerHTML = `
        <div class="subscription-info">
          <div class="info-item">
            <div class="info-label">Current Plan</div>
            <div class="info-value">${subscriptionData.planName} <span class="badge badge-success">${subscriptionData.status}</span></div>
          </div>
          <div class="info-item">
            <div class="info-label">Monthly Price</div>
            <div class="info-value">$${(subscriptionData.monthlyPrice / 100).toFixed(2)}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Renewal Date</div>
            <div class="info-value">${endDate.toLocaleDateString()}</div>
          </div>
          <div class="info-item">
            <div class="info-label">Actions</div>
            <button class="btn btn-secondary" onclick="manageSubscription()">Manage Billing</button>
          </div>
        </div>
      `;
    }

    function renderTrial(trial) {
      const section = document.getElementById('subscriptionSection');
      const trialEnd = trial?.endsAt ? new Date(trial.endsAt) : null;
      
      section.innerHTML = `
        <div class="subscription-info">
          <div class="info-item">
            <div class="info-label">Status</div>
            <div class="info-value"><span class="badge badge-info">Trial</span></div>
          </div>
          ${trialEnd ? `
          <div class="info-item">
            <div class="info-label">Trial Ends</div>
            <div class="info-value">${trialEnd.toLocaleDateString()}</div>
          </div>
          ` : ''}
          <div class="info-item">
            <div class="info-label">Get Started</div>
            <div class="info-value"><button class="btn btn-primary" onclick="showUpgradePlans()">Choose a Plan</button></div>
          </div>
        </div>
      `;
    }

    function renderUsage() {
      if (!usageData) return;

      const section = document.getElementById('subscriptionSection');
      const feedbackPercent = usageData.limits.feedbackLimit 
        ? (usageData.feedbackCount / usageData.limits.feedbackLimit) * 100
        : 0;

      const usageHtml = `
        <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
          <h3 style="font-size: 16px; margin-bottom: 16px;">Usage This Period</h3>
          <div class="info-item">
            <div class="info-label">Feedback Submissions</div>
            <div class="info-value">${usageData.feedbackCount} ${usageData.limits.feedbackLimit ? `/ ${usageData.limits.feedbackLimit}` : '(Unlimited)'}</div>
            ${usageData.limits.feedbackLimit ? `<div class="progress-bar"><div class="progress-fill ${feedbackPercent > 80 ? 'warning' : ''} ${feedbackPercent >= 100 ? 'danger' : ''}" style="width: ${Math.min(feedbackPercent, 100)}%"></div></div>` : ''}
          </div>
        </div>
      `;

      section.innerHTML += usageHtml;
    }

    async function showUpgradePlans() {
      try {
        const response = await fetch('/api/billing/pricing');
        const data = await response.json();

        const plansSection = document.getElementById('plansSection');
        const pricingGrid = document.getElementById('pricingGrid');
        
        pricingGrid.innerHTML = data.tiers.map(tier => `
          <div class="pricing-card ${subscriptionData && subscriptionData.planTier === tier.id ? 'current' : ''}">
            <div class="pricing-name">${tier.name}</div>
            <div class="pricing-price">$${(tier.monthlyPrice / 100).toFixed(0)}<span>/mo</span></div>
            <ul class="pricing-features">
              <li>${tier.feedbackLimit || 'Unlimited'} feedback/month</li>
              <li>${tier.locationsLimit || 'Unlimited'} locations</li>
              <li>${tier.features.whiteLabel ? 'White label' : 'Standard branding'}</li>
              <li>${tier.features.analytics === 'advanced' ? 'Advanced' : 'Basic'} analytics</li>
              <li>${tier.features.support === 'priority' ? 'Priority' : 'Email'} support</li>
            </ul>
            ${(!subscriptionData || subscriptionData.planTier !== tier.id) ? 
              `<button class="btn btn-primary" style="width: 100%" onclick="upgradeToPlan('${tier.stripePriceId}')">Select Plan</button>` :
              `<button class="btn btn-secondary" style="width: 100%" disabled>Current Plan</button>`
            }
          </div>
        `).join('');

        plansSection.style.display = 'block';
      } catch (error) {
        console.error('Failed to load plans:', error);
      }
    }

    async function upgradeToPlan(priceId) {
      try {
        const response = await fetch('/api/billing/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ priceId })
        });

        const data = await response.json();
        if (data.success && data.url) {
          window.location.href = data.url;
        }
      } catch (error) {
        console.error('Failed to create checkout:', error);
        alert('Failed to start checkout. Please try again.');
      }
    }

    async function manageSubscription() {
      try {
        const response = await fetch('/api/billing/create-portal', {
          method: 'POST',
          credentials: 'include'
        });

        const data = await response.json();
        if (data.success && data.url) {
          window.location.href = data.url;
        }
      } catch (error) {
        console.error('Failed to open billing portal:', error);
        alert('Failed to open billing portal. Please try again.');
      }
    }

    async function logout() {
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
      } catch (error) {
        console.error('Logout error:', error);
      }
      localStorage.removeItem('clientUser');
      window.location.href = '/client/index.html';
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', async () => {
      const isAuthed = await checkAuth();
      if (!isAuthed) return;

      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';

      await Promise.all([
        loadDashboard(),
        loadSubscription(),
        loadUsage()
      ]);
    });
  </script>
</body>
</html>
