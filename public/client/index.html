<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login - Hype Insight Reviews</title>
  <style>
    :root {
      --color-primary: #46B646;
      --color-dark: #02202E;
      --color-white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-dark);
      color: var(--color-white);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo img {
      height: 60px;
      margin-bottom: 16px;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-white);
      margin-bottom: 8px;
    }

    .logo p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--color-white);
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.05);
      color: var(--color-white);
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(70, 182, 70, 0.3);
    }

    .btn-primary:hover {
      background: #3da03d;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(70, 182, 70, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid rgba(231, 76, 60, 0.5);
      color: #ff6b6b;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }

    .loading {
      display: none;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 16px;
    }

    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="/Logo/logo-resized.webp" alt="Hype Insight Logo">
      <h1>Client Dashboard</h1>
      <p>Sign in to manage your reviews</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="your@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-primary" id="loginButton">Sign In</button>

      <div id="loadingMessage" class="loading">
        Signing in...
      </div>
    </form>

    <div class="footer">
      &copy; 2025 Hype Insight. All rights reserved.
    </div>
  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const loadingMessage = document.getElementById('loadingMessage');
      const loginButton = document.getElementById('loginButton');

      // Show loading
      loadingMessage.classList.add('show');
      errorMessage.classList.remove('show');
      loginButton.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          // Store user info in localStorage for client-side access
          localStorage.setItem('clientUser', JSON.stringify(data.user));
          
          // Redirect to dashboard
          window.location.href = '/client/dashboard.html';
        } else {
          // Show error
          loadingMessage.classList.remove('show');
          loginButton.disabled = false;
          errorMessage.textContent = data.error || 'Invalid email or password. Please try again.';
          errorMessage.classList.add('show');
        }
      } catch (error) {
        console.error('Login error:', error);
        loadingMessage.classList.remove('show');
        loginButton.disabled = false;
        errorMessage.textContent = 'Connection error. Please try again.';
        errorMessage.classList.add('show');
      }
    }

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/api/auth/me', {
          credentials: 'include'
        });
        
        if (response.ok) {
          // Already logged in, redirect to dashboard
          window.location.href = '/client/dashboard.html';
        }
      } catch (error) {
        // Not logged in, stay on login page
      }
    });
  </script>
</body>
</html>
